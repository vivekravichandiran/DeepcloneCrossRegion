resources:
  jobs:
    inventory_job:
      name: "DeepClone 1 - INVENTORY [${bundle.target}]"
      description: "Discovers and onboards source tables into migration_control (QUEUED status)."
      tags:
        team: deepclone
        phase: inventory

      parameters:
        - name: clone_type
          default: ${var.clone_type}
        - name: meta_catalog
          default: ${var.meta_catalog}
        - name: meta_schema
          default: ${var.meta_schema}
        # ── Input source parameters (CSV-oriented) ─────────────────────────────
        # This job is CSV-first: selection AND target come from the CSV file
        # itself. The JOB-mode selection inputs (source_catalogs/source_schemas/
        # source_tables/target_catalog) and the YAML path (yaml_config_path) are
        # intentionally NOT exposed as job parameters; source_warehouse_id is
        # likewise omitted (only used for clone_type=direct_adls). selection_type
        # uses a fixed default hardcoded in base_parameters below.
        #   var.input_type → CSV / YAML / JOB (display; the notebook auto-detects
        #                     the effective mode from csv_path being non-blank).
        #   var.csv_path   → full path to the CSV table-mapping file.
        - name: input_type
          default: ${var.input_type}
        - name: csv_path
          default: ${var.csv_path}
        # exclusion_csv_path: GLOBAL catalog/schema/table exclusion list,
        # applied on top of whichever input_type resolved the selection
        # (JOB/YAML/CSV) — independent of that mechanism's own per-row
        # exclude_schemas/exclude_tables. See orchestrator/exclusion_manager.py
        # for the CSV format. Excluded tables are skipped at INVENTORY and
        # logged to migration_exclusion_log for audit. Blank = no exclusions.
        - name: exclusion_csv_path
          default: ${var.exclusion_csv_path}
        # ── Batch parameters — set per migration owner ────────────────────────
        - name: batch_id
          default: ""          # blank = auto-generated (date + short UUID)
        - name: chunk_capacity_gb
          default: "50"        # GB soft-limit per chunk / cluster
        - name: max_concurrent_chunks
          default: ${var.max_concurrent_chunks}   # max parallel clusters per batch
        - name: parallel_threads
          default: "4"         # clone threads within each cluster
        - name: min_executors
          default: ${var.min_executors}   # worker nodes (executors) per chunk cluster
        # target_warehouse_id: plain (non-secret) SQL warehouse identifier —
        # NOT a credential. No client_id/client_secret/secret-scope anywhere:
        # SqlClient/ApiClient authenticate natively via databricks.sdk.core.
        # Config(). (source_warehouse_id is omitted — only used for
        # clone_type=direct_adls, irrelevant to this CSV/delta_share job.)
        - name: target_warehouse_id
          default: ${var.target_warehouse_id}
        # force_reonboard: by default INVENTORY is idempotent — it SKIPS any
        # table already COMPLETED/VALIDATED/FAILED_PERMANENT/SKIPPED in
        # migration_control (see InventoryManager docstring), so re-running
        # against the same CSV/YAML a second time onboards 0 NEW tables (this
        # is by design — it's not a bug, just idempotency). Set to "true" to
        # re-onboard everything anyway under a fresh batch_id/run_id — e.g.
        # to re-exercise the same table list end-to-end for a repeat test.
        - name: force_reonboard
          default: "${var.force_reonboard}"
        # require_target_precreated: governance gate. When "true", a table
        # whose target_catalog.target_schema.target_table does not already
        # exist in the target workspace is enlisted into migration_control
        # as SKIPPED (error_code=TARGET_NOT_PRECREATED) instead of QUEUED,
        # so DEEP_CLONE/RETRY never touch it. Default "false" preserves the
        # original behavior (DEEP_CLONE auto-creates the target table).
        - name: require_target_precreated
          default: "${var.require_target_precreated}"
        # skip_describe_detail: when "true", bypasses DESCRIBE DETAIL on the
        # source entirely — tables are still onboarded as QUEUED but with
        # NULL size/file/workload metadata. Use when DESCRIBE DETAIL itself
        # is failing for reasons outside this framework's control (storage
        # firewall, Delta Share ABAC policy — see databricks.yml comment for
        # the full rationale). Default "false" preserves full metadata
        # collection.
        - name: skip_describe_detail
          default: "${var.skip_describe_detail}"
        # inventory_parallel_threads: number of tables INVENTORY processes
        # concurrently (ThreadPoolExecutor). Reads (existing-row lookup,
        # DESCRIBE DETAIL, DESCRIBE HISTORY) run in parallel; the final
        # migration_control MERGE write per table is always serialized
        # (see orchestrator/inventory_manager.py's _write_lock) to avoid
        # Delta concurrent-write conflicts. Set to "1" to fully restore the
        # original strictly-sequential behavior.
        - name: inventory_parallel_threads
          default: "${var.inventory_parallel_threads}"

      tasks:
        - task_key: inventory
          notebook_task:
            notebook_path: ${var.orchestrator_notebook}
            base_parameters:
              mode: INVENTORY
              input_type: "{{job.parameters.input_type}}"
              csv_path: "{{job.parameters.csv_path}}"
              exclusion_csv_path: "{{job.parameters.exclusion_csv_path}}"
              selection_type: catalog
              clone_type: "{{job.parameters.clone_type}}"
              meta_catalog: "{{job.parameters.meta_catalog}}"
              meta_schema: "{{job.parameters.meta_schema}}"
              batch_id: "{{job.parameters.batch_id}}"
              chunk_capacity_gb: "{{job.parameters.chunk_capacity_gb}}"
              max_concurrent_chunks: "{{job.parameters.max_concurrent_chunks}}"
              parallel_threads: "{{job.parameters.parallel_threads}}"
              min_executors: "{{job.parameters.min_executors}}"
              force_reonboard: "{{job.parameters.force_reonboard}}"
              require_target_precreated: "{{job.parameters.require_target_precreated}}"
              skip_describe_detail: "{{job.parameters.skip_describe_detail}}"
              inventory_parallel_threads: "{{job.parameters.inventory_parallel_threads}}"
              target_warehouse_id: "{{job.parameters.target_warehouse_id}}"
          job_cluster_key: orchestrator_cluster

      job_clusters:
        - job_cluster_key: orchestrator_cluster
          new_cluster:
            spark_version: ${var.worker_spark_version}
            instance_pool_id: ${var.instance_pool_id}
            num_workers: 2
            # REQUIRED for Unity Catalog access — see 00_setup_control_tables.yml
            # for the full rationale (avoids non-UC "No Isolation Shared" default).
            data_security_mode: DATA_SECURITY_MODE_AUTO
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
            spark_env_vars:
              PYTHONPATH: "${workspace.file_path}"
            # NOTE: no cluster_log_conf here — dbfs:/ log delivery destinations
            # are rejected outright ("INVALID_PARAMETER_VALUE: Invalid cluster
            # log storage info") in workspaces where legacy DBFS root access is
            # disabled (common alongside Unity Catalog hardening). Logs remain
            # fully viewable live in the job run UI without this; re-add only
            # as a volumes: destination pointing at a pre-provisioned UC Volume
            # if durable log retention is required.

      email_notifications:
        on_failure:
          - vivek.ravichandiran@databricks.com
