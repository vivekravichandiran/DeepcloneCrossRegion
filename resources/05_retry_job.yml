resources:
  jobs:
    retry_job:
      name: "DeepClone 5 - RETRY [${bundle.target}]"
      description: "Re-queues RETRY_PENDING tables with exponential backoff and re-dispatches clones."
      tags:
        team: deepclone
        phase: retry

      parameters:
        - name: meta_catalog
          default: ${var.meta_catalog}
        - name: meta_schema
          default: ${var.meta_schema}
        - name: max_retries
          default: ${var.max_retries}
        # retry_permanent: OPT-IN. "true" makes this RETRY run first reset the
        # batch's FAILED_PERMANENT rows back to RETRY_PENDING (fresh attempt
        # budget) so they get re-driven, then attempt them once. Default
        # "false" keeps FAILED_PERMANENT terminal (unchanged behaviour).
        - name: retry_permanent
          default: ${var.retry_permanent}
        # ── Chunk-worker compute (overridable at run time) ────────────────────
        # Back the {{job.parameters.*}} templates in worker_cluster_json — pool
        # is used when non-blank, else the on-demand node type (see
        # resources/03_deep_clone_job.yml).
        - name: worker_spark_version
          default: ${var.worker_spark_version}
        - name: worker_instance_pool_id
          default: ${var.worker_instance_pool_id}
        - name: worker_node_type
          default: ${var.worker_node_type}
        - name: worker_num_workers
          default: "${var.worker_num_workers}"
        - name: batch_id
          default: ""    # retry only this batch; blank = retry ALL
        - name: max_concurrent_chunks
          default: ${var.max_concurrent_chunks}
        - name: parallel_threads
          default: "4"
        - name: min_executors
          default: ${var.min_executors}
        # worker_notebook_path is no longer a job parameter — it uses a fixed
        # default (${var.worker_notebook}) hardcoded in base_parameters below.
        # target_warehouse_id: plain (non-secret) SQL warehouse identifier —
        # NOT a credential. SqlClient/ApiClient authenticate natively via
        # databricks.sdk.core.Config(). (source_warehouse_id is omitted — only
        # used for clone_type=direct_adls; RETRY never uses src_sql.)
        - name: target_warehouse_id
          default: ${var.target_warehouse_id}
        # clone_type: MUST match whatever clone_type INVENTORY/DEEP_CLONE
        # actually used for this batch.
        - name: clone_type
          default: ${var.clone_type}

      tasks:
        - task_key: retry
          notebook_task:
            notebook_path: ${var.orchestrator_notebook}
            base_parameters:
              mode: RETRY
              input_type: JOB
              clone_type: "{{job.parameters.clone_type}}"
              meta_catalog: "{{job.parameters.meta_catalog}}"
              meta_schema: "{{job.parameters.meta_schema}}"
              max_retries: "{{job.parameters.max_retries}}"
              retry_permanent: "{{job.parameters.retry_permanent}}"
              batch_id: "{{job.parameters.batch_id}}"
              max_concurrent_chunks: "{{job.parameters.max_concurrent_chunks}}"
              parallel_threads: "{{job.parameters.parallel_threads}}"
              min_executors: "{{job.parameters.min_executors}}"
              worker_notebook_path: ${var.worker_notebook}
              target_warehouse_id: "{{job.parameters.target_warehouse_id}}"
              # No spark_env_vars needed — chunk_worker_notebook.py runs DEEP
              # CLONE directly via Spark on its own cluster and never calls
              # SqlClient/ApiClient, so it has no auth/secrets dependency.
              # Chunk workers ALWAYS use the pre-warmed instance pool
              # (var.worker_instance_pool_id) — node type governed by the pool,
              # so no node_type_id/azure_attributes here (see
              # resources/03_deep_clone_job.yml).
              worker_cluster_json: >
                {
                  "spark_version": "{{job.parameters.worker_spark_version}}",
                  "instance_pool_id": "{{job.parameters.worker_instance_pool_id}}",
                  "node_type_id": "{{job.parameters.worker_node_type}}",
                  "num_workers": "{{job.parameters.worker_num_workers}}",
                  "data_security_mode": "DATA_SECURITY_MODE_AUTO"
                }
          job_cluster_key: orchestrator_cluster

      job_clusters:
        - job_cluster_key: orchestrator_cluster
          new_cluster:
            spark_version: ${var.worker_spark_version}
            instance_pool_id: ${var.instance_pool_id}
            num_workers: 2
            # REQUIRED for Unity Catalog access — see 00_setup_control_tables.yml
            # for the full rationale (avoids non-UC "No Isolation Shared" default).
            data_security_mode: DATA_SECURITY_MODE_AUTO
            spark_env_vars:
              PYTHONPATH: "${workspace.file_path}"

      email_notifications:
        on_failure:
          - vivek.ravichandiran@databricks.com
