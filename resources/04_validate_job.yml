resources:
  jobs:
    validate_job:
      name: "DeepClone 4 - VALIDATE [${bundle.target}]"
      description: "Validates COMPLETED clone records: size, file count, Delta version, and row count (counted VERSION AS OF the source_version/target_version captured in migration_control). Row counts are persisted to migration_control (latest) and migration_validation_history (append-only audit trail)."
      tags:
        team: deepclone
        phase: validate

      parameters:
        - name: meta_catalog
          default: ${var.meta_catalog}
        - name: meta_schema
          default: ${var.meta_schema}
        # clone_type determines which SQL client "source" tables are validated
        # against: for delta_share, source tables are read via the shared
        # catalog on the TARGET workspace (tgt_sql); for direct_adls they're
        # read from the actual SOURCE workspace (src_sql). Without this wired,
        # the clone_type widget silently defaults to "direct_adls" regardless
        # of what was actually used to clone — harmless when source/target
        # happen to share one workspace (as in this dev/test setup), but wrong
        # for real cross-region delta_share validation.
        - name: clone_type
          default: ${var.clone_type}
        - name: row_count_validation
          default: ${var.row_count_validation}
        - name: batch_id
          default: ""    # filter validation to this batch only; blank = validate ALL
        # target_warehouse_id: plain (non-secret) SQL warehouse identifier —
        # NOT a credential. SqlClient/ApiClient authenticate natively via
        # databricks.sdk.core.Config(). (source_warehouse_id is omitted — for
        # delta_share, source tables are validated via tgt_sql on the target
        # workspace; it is only used for clone_type=direct_adls.)
        - name: target_warehouse_id
          default: ${var.target_warehouse_id}

      tasks:
        - task_key: validate
          notebook_task:
            notebook_path: ${var.orchestrator_notebook}
            base_parameters:
              mode: VALIDATE
              input_type: JOB
              clone_type: "{{job.parameters.clone_type}}"
              meta_catalog: "{{job.parameters.meta_catalog}}"
              meta_schema: "{{job.parameters.meta_schema}}"
              validation_enabled: "true"
              row_count_validation: "{{job.parameters.row_count_validation}}"
              batch_id: "{{job.parameters.batch_id}}"
              target_warehouse_id: "{{job.parameters.target_warehouse_id}}"
          job_cluster_key: orchestrator_cluster

      job_clusters:
        - job_cluster_key: orchestrator_cluster
          new_cluster:
            spark_version: ${var.worker_spark_version}
            instance_pool_id: ${var.instance_pool_id}
            num_workers: 2
            # REQUIRED for Unity Catalog access — see 00_setup_control_tables.yml
            # for the full rationale (avoids non-UC "No Isolation Shared" default).
            data_security_mode: DATA_SECURITY_MODE_AUTO
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
            spark_env_vars:
              PYTHONPATH: "${workspace.file_path}"

      email_notifications:
        on_failure:
          - vivek.ravichandiran@databricks.com
