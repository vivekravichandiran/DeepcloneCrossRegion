resources:
  jobs:
    setup_control_tables_job:
      name: "DeepClone 0 - Setup Control Tables"
      description: "Creates migration_control and migration_attempts Delta tables on the target workspace."
      tags:
        team: deepclone
        phase: setup

      parameters:
        # target_warehouse_id: plain (non-secret) SQL warehouse identifier —
        # NOT a credential. No client_id/client_secret/secret-scope anywhere:
        # SqlClient authenticates natively via databricks.sdk.core.Config().
        - name: target_warehouse_id
          default: ${var.target_warehouse_id}

      tasks:
        - task_key: setup_tables
          notebook_task:
            notebook_path: ${var.setup_notebook}
            base_parameters:
              meta_catalog: ${var.meta_catalog}
              meta_schema: ${var.meta_schema}
              repo_root: ${workspace.file_path}
              target_warehouse_id: "{{job.parameters.target_warehouse_id}}"
          job_cluster_key: default_cluster

      job_clusters:
        - job_cluster_key: default_cluster
          new_cluster:
            spark_version: ${var.worker_spark_version}
            instance_pool_id: ${var.instance_pool_id}
            num_workers: 2
            # REQUIRED for Unity Catalog access — without this, some
            # workspaces default new_cluster to a non-UC "No Isolation
            # Shared" mode, which fails with "cluster is not attached to
            # Unity Catalog" the moment the notebook touches a UC table.
            # AUTO lets Databricks pick the best UC-compatible mode for the
            # workspace/policy (no single_user_name needed).
            data_security_mode: DATA_SECURITY_MODE_AUTO
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
            spark_env_vars:
              PYTHONPATH: "${workspace.file_path}"

      email_notifications:
        on_failure:
          - vivek.ravichandiran@databricks.com
