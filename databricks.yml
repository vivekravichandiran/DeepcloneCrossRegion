bundle:
  name: deepclone_orchestrator

# ── Authentication — NO external secrets ──────────────────────────────────────
# This bundle does not define, reference, or require any Databricks Secret
# scope, client_id, or client_secret anywhere (cluster configs or code).
# orchestrator/sql_client.py (SqlClient) and orchestrator/api_client.py
# (ApiClient) authenticate natively via the Databricks SDK's unified auth
# (`databricks.sdk.core.Config()`), which auto-detects the run's own auth
# context whenever this code executes inside a Databricks job/notebook —
# exactly how every job in resources/*.yml runs. There is nothing to
# provision, rotate, or store.
#
# The only workspace-connection values that still exist are the two
# `target_warehouse_id` / `source_warehouse_id` variables below — plain,
# non-secret SQL warehouse IDs (not credentials) so the SQL client knows
# which warehouse to route statements to:
#   • target_warehouse_id — ALWAYS required, for BOTH clone_type values. The
#     target workspace hosts the control tables and runs all VALIDATE/
#     DEEP_CLONE SQL, including reading the delta_share catalog when
#     clone_type=delta_share.
#   • source_warehouse_id — ONLY required when clone_type=direct_adls (the
#     source SQL warehouse is queried via DESCRIBE DETAIL to resolve the
#     abfss:// path). For clone_type=delta_share (this bundle's default —
#     see clone_type below), the source workspace is never contacted at all:
#     orchestrator_notebook.py skips src_sql.start_warehouse() entirely for
#     delta_share (see the _needs_src_warehouse guard), and DEEP_CLONE/RETRY
#     never touch src_sql/src_api regardless of clone_type. Leave it blank
#     for delta_share deployments.
#
# configs/config.json (a legacy, unused config file from an earlier
# pre-bundle architecture that duplicated source/target URL+SP+secret fields
# and was never read by any current orchestrator/*.py code) has been removed
# — this section plus configs/migration.yaml's source:/target: blocks are now
# the only places workspace connection info is documented.

# ── Bundle variables (overridable per target) ────────────────────────────────
variables:
  meta_catalog:
    description: "Catalog where migration_control & migration_attempts tables live"
    default: hive_metastore
  meta_schema:
    description: "Schema for control tables"
    default: migration_meta
  # ── JOB-mode-only table selection (IGNORED when input_type is YAML or CSV) ───
  # These four variables are ONLY consulted by InputResolver._resolve_job(),
  # which only runs when input_type=JOB (i.e. neither yaml_config_path nor
  # csv_path is set — see input_type/yaml_config_path/csv_path further below).
  # When input_type is YAML or CSV, source AND target catalog/schema/table for
  # every migrated table come exclusively from that YAML/CSV file's own
  # content — these variables are not read at all in that code path, so
  # editing them has zero effect on YAML/CSV-driven runs.
  target_catalog:
    description: "[JOB mode only] Default target catalog for cloned tables"
    default: hive_metastore
  source_catalog_filter:
    description: "[JOB mode only] JSON array of source catalogs to process"
    default: '["ril_bulk"]'
  source_schema_filter:
    description: "[JOB mode only] JSON array of source schemas (catalog.schema)"
    default: "[]"
  source_table_filter:
    description: "[JOB mode only] JSON array of source tables (FQN)"
    default: "[]"
  clone_type:
    # Left BLANK on purpose: when input_type=YAML, migration.yaml's own
    # `migration.clone_type:` always wins (orchestrator_notebook.py only
    # applies this variable's value when input_type is JOB or CSV — see the
    # comment at that assignment). A non-blank default here would show up as
    # a misleading "(resolved)" value in the Databricks Jobs UI Parameters
    # panel that contradicts whatever the YAML file actually specifies, even
    # though it has zero effect on YAML-mode runs. For JOB/CSV mode (which
    # have no YAML file to read clone_type from), leaving this blank falls
    # back to OrchestratorConfig's built-in default (direct_adls) — set a
    # value here only if you want to force a specific mode for JOB/CSV runs.
    description: "[JOB/CSV mode only, optional] Clone mode override: direct_adls or delta_share. Leave blank to use the built-in default (direct_adls) for JOB/CSV, or defer to the YAML file's own clone_type when input_type=YAML."
    default: "delta_share"
  validation_enabled:
    description: "Enable post-clone validation"
    default: "true"
  row_count_validation:
    # Counts are taken VERSION AS OF the source_version/target_version already
    # captured in migration_control at inventory/clone time (not the live
    # current version), so results stay consistent even if source tables get
    # new writes after cloning. Results are persisted as real columns
    # (migration_control.source_row_count/target_row_count — latest run) AND
    # as an append-only audit trail (migration_validation_history — every
    # run), for later review. Expensive (full COUNT(*) scan both sides) —
    # set to "false" to skip it for very large tables if needed.
    description: "Enable row-count validation, counted AS OF the versions recorded in migration_control (expensive — full table scan)"
    default: "true"
  max_retries:
    description: "Max retry attempts per table"
    default: "3"

  # ── Orchestrator cluster (lightweight control plane, 1-2 nodes) ──────────────
  worker_spark_version:
    description: "Spark version for orchestrator + chunk worker clusters"
    default: "17.3.x-scala2.13"   # 17.3 LTS (Apache Spark 4.0.0, Scala 2.13)

  # ── Chunk worker cluster — one ephemeral cluster per chunk ────────────────────
  # Standard_E32ds_v5: 32 vCPUs, 256 GB RAM per node — memory-optimized, sized
  # for larger/heavier DEEP CLONE chunks. Provisioned on-demand directly (NOT
  # via instance_pool_id — the shared pool below is pinned to Standard_D4s_v3
  # and used only for the lightweight orchestrator control-plane clusters).
  worker_node_type:
    description: "Azure VM type for chunk worker clusters"
    default: Standard_E32ds_v5
  setup_node_type:
    description: "Azure VM type for the lightweight control-table setup job (small & widely available)"
    default: Standard_D4s_v3    # 4 vCPU / 16 GB — plenty for DDL-only setup
  worker_num_workers:
    description: "Number of Spark worker nodes (executors) per chunk cluster"
    default: "8"                  # → 8 executor nodes + 1 driver = 9 nodes per chunk cluster

  # ── Instance pool — used ONLY for the lightweight orchestrator control-plane
  # job_clusters (2-node, always-on for the life of the job) so debugging/
  # iterative test runs start in seconds instead of minutes (idle pool
  # instances are reused instead of provisioning fresh on-demand VMs). The
  # pool is pinned to Standard_D4s_v3 — node type / provisioning strategy is
  # fixed by the pool itself wherever instance_pool_id is used.
  # Ephemeral CHUNK WORKER clusters (worker_cluster_json, one per DEEP_CLONE/
  # RETRY chunk) do NOT use this pool — they provision on-demand directly
  # with node_type_id: ${var.worker_node_type} instead, since chunk sizing
  # (VM type / worker count) is independent of the control-plane pool.
  instance_pool_id:
    description: "Instance pool ID for the orchestrator control-plane job_clusters only (fast start for debugging/dev iteration)"
    default: "0908-093007-hoped4-pool-q4mi8hia"

  # ── SQL warehouse IDs — plain, non-secret identifiers (NOT credentials) ──────
  # No client_id/client_secret/Databricks Secret scope exists anywhere in this
  # bundle. SqlClient/ApiClient authenticate natively via the Databricks SDK's
  # Config() (see the "Authentication" comment block at the top of this file).
  target_warehouse_id:
    description: "SQL warehouse id (target workspace) for control-table SQL and delta_share queries. Always required."
    default: "5fe1692f119e2528"    # Serverless Starter Warehouse
  source_warehouse_id:
    description: "[direct_adls only] SQL warehouse id (source workspace), used for DESCRIBE DETAIL. Leave blank for delta_share."
    default: ""

  # ── Batch / Chunk execution parameters ────────────────────────────────────────
  batch_id:
    description: "User/team isolation key. Multiple parties use different batch_ids to run concurrently."
    default: ""                   # blank = auto-generated (date + UUID) at runtime
  max_concurrent_chunks:
    description: "Max cluster jobs (chunks) running simultaneously PER BATCH. Controls cluster spend."
    default: "5"                  # 5 × 9-node (1 driver + 8 executor) E32ds_v5 clusters live at once per batch
  parallel_threads:
    description: "Clone threads inside each chunk cluster. Each thread = one concurrent DEEP CLONE."
    default: "4"                  # 4 tables copying simultaneously on each chunk cluster
  chunk_capacity_gb:
    description: "Soft GB cap per chunk. Tables are bin-packed until this limit OR max_tables_per_chunk (auto-derived as ceil(n_tables/max_concurrent_chunks) in orchestrator_notebook.py) is hit — the count cap guarantees real chunk/cluster parallelism even when the table set is small in total GB (e.g. many tiny tables)."
    default: "500"                 # 500 GB per chunk; tune based on cluster memory
  min_executors:
    description: "Minimum Spark worker nodes enforced per chunk cluster (overrides worker_num_workers if lower — see notebooks/orchestrator_notebook.py's num_workers-floor logic)"
    default: "8"                  # aligned with worker_num_workers = 8

  # ── Table-selection input source (INVENTORY job) ─────────────────────────────
  # Set input_type to CSV, YAML, or JOB here to control the migration source
  # for ALL runs without touching resources/*.yml or passing run-now overrides.
  # The notebook still auto-detects from whichever path below is non-blank
  # (csv_path wins over yaml_config_path if both are set), so input_type is
  # mainly documentation/display here — but keep it consistent with whichever
  # path you actually set.
  input_type:
    description: "Table-selection source for INVENTORY: CSV, YAML, or JOB"
    default: "CSV"
  yaml_config_path:
    # configs/migration.yaml is the ONE canonical config file — it supports
    # every input flavour (CSV delegation, or catalog/schema/table mappings)
    # via what's active inside it; see the header comment in that file.
    description: "Full deployed path to the migration YAML config, used when input_type=YAML"
    default: ${workspace.file_path}/configs/migration.yaml
  csv_path:
    # Scale test (2026-09-09): whole-catalog clone, ril_bulk_02 (130 tables,
    # 5 schemas) → ril_tgt_02, via a single clone_type=catalog row (Format B).
    # The earlier 4-table smoke-test CSV is preserved at
    # configs/archive/csv_test_ril_bulk_02.csv for reference.
    description: "Full deployed path to the CSV table-mapping file, used when input_type=CSV. Leave blank to use YAML instead."
    default: "${workspace.file_path}/configs/csv_scale_ril_bulk_02_full.csv"
  exclusion_csv_path:
    # GLOBAL catalog/schema/table exclusion list — applied at INVENTORY time
    # on top of whichever input_type resolved the selection (JOB/YAML/CSV),
    # regardless of which one is active. This is independent of the per-row
    # exclude_schemas/exclude_tables already supported inside a single YAML
    # mapping entry or CSV Format-B row (input_resolver.py) — this list is
    # global and cross-cutting instead of scoped to one row. See
    # orchestrator/exclusion_manager.py for the exact CSV format
    # (exclude_type=catalog|schema|table + catalog/schema/table columns,
    # glob patterns allowed). Excluded tables never reach migration_control
    # — they're recorded into migration_exclusion_log for audit/review
    # instead. Leave blank for no exclusions (default, zero behavior change).
    description: "Full deployed path to a CSV of catalog/schema/table exclusion rules, applied at INVENTORY regardless of input_type. Blank = no exclusions."
    default: "${workspace.file_path}/configs/exclusion_list_example.csv"
  force_reonboard:
    # INVENTORY is idempotent by default: a table already COMPLETED/VALIDATED/
    # FAILED_PERMANENT/SKIPPED in migration_control is intentionally SKIPPED
    # on subsequent runs against the same CSV/YAML (see InventoryManager's
    # docstring) — re-running the same table list twice in a row is expected
    # to onboard 0 NEW tables, that's not a bug. Set to "true" (at deploy time
    # here, or as a run-now override) to force those tables to be re-onboarded
    # under a fresh batch_id/run_id anyway — e.g. to re-exercise the same
    # table list end-to-end for a repeat test. Left "false" by default so
    # production runs never accidentally re-clone already-validated tables.
    description: "Re-onboard tables even if already COMPLETED/VALIDATED (re-test the same CSV/YAML)"
    default: "false"
  require_target_precreated:
    # Governance gate for INVENTORY. When "true", a table whose
    # target_catalog.target_schema.target_table does NOT already exist in
    # the target workspace is still enlisted into migration_control — but
    # with status=SKIPPED (error_code=TARGET_NOT_PRECREATED) instead of
    # QUEUED, so DEEP_CLONE/RETRY (which only ever pick up status='QUEUED')
    # never touch it. Use this when target tables must be pre-provisioned
    # (schema/partitioning/grants) by another team before DEEP_CLONE is
    # allowed to land data. Once the target is created, re-run INVENTORY
    # with force_reonboard=true to re-check and queue it.
    # Left "false" by default so DEEP_CLONE keeps auto-creating target
    # tables via CREATE OR REPLACE ... DEEP CLONE (the original behavior,
    # used by every prior test in this repo).
    description: "Skip (don't queue) tables whose target doesn't already exist; require pre-provisioning"
    default: "false"
  skip_describe_detail:
    # When "true", INVENTORY never runs DESCRIBE DETAIL on the source at all.
    # Tables are still onboarded as QUEUED, but size_in_bytes/size_gb/
    # source_num_files/workload_class/workload_weight/source_version are all
    # left NULL in migration_control (VALIDATE already tolerates a NULL
    # source_version — falls back to an unversioned COUNT(*)). The source
    # existence/Delta-format check normally done by DESCRIBE DETAIL is
    # skipped too, so a bad source table now only surfaces as a DEEP_CLONE-
    # time failure instead of an INVENTORY-time one.
    # Use case: DESCRIBE DETAIL needs to list files in the source's
    # underlying storage — this can fail for reasons entirely outside this
    # framework's control, e.g. an Azure storage account firewall rejecting
    # the request ("This Azure storage request is not authorized...Firewalls
    # and virtual networks settings may be blocking access"), or a Delta
    # Share entity governed by an ABAC policy that Databricks does not yet
    # support for DESCRIBE DETAIL ("PERMISSION_DENIED: ... has ABAC policy
    # governing the share owner, which is not supported yet"). Set this to
    # "true" to still get the affected tables onboarded/deep-cloned while
    # that external issue is being resolved by the storage/UC admin.
    # Left "false" by default — recommended whenever DESCRIBE DETAIL works.
    description: "Skip DESCRIBE DETAIL on source entirely during INVENTORY; leave size/file/workload metadata NULL"
    default: "false"

  # Workspace paths
  orchestrator_notebook:
    description: "Path to orchestrator_notebook on target workspace"
    default: ${workspace.file_path}/notebooks/orchestrator_notebook
  worker_notebook:
    description: "Path to chunk_worker_notebook on target workspace"
    default: ${workspace.file_path}/notebooks/chunk_worker_notebook
  setup_notebook:
    description: "Path to setup_control_tables notebook"
    default: ${workspace.file_path}/notebooks/setup_control_tables

# ── Deployment targets ────────────────────────────────────────────────────────
targets:
  dev:
    mode: development
    workspace:
      host: https://adb-7405616318078204.4.azuredatabricks.net
    variables:
      meta_catalog: ril_migration_catalog
      meta_schema: migration_meta

  prod:
    mode: production
    workspace:
      host: https://adb-7405616318078204.4.azuredatabricks.net
    variables:
      meta_catalog: ril_migration_catalog
      meta_schema: migration_meta

# ── Workspace file sync ───────────────────────────────────────────────────────
workspace:
  root_path: ~/deepclone_orchestrator/${bundle.target}

# ── Resources ─────────────────────────────────────────────────────────────────
include:
  - resources/*.yml
