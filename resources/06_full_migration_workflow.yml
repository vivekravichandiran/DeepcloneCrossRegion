resources:
  jobs:
    full_migration_workflow:
      name: "DeepClone - Full Migration Workflow [${bundle.target}]"
      description: |
        End-to-end migration workflow: INVENTORY → DRY_RUN → DEEP_CLONE → VALIDATE → RETRY (if needed).
        All tasks are parameterized and modular. DRY_RUN runs in parallel with INVENTORY for planning.
      tags:
        team: deepclone
        phase: full_workflow

      # ── Job-level parameters (passed at run time) ──────────────────────────
      parameters:
        # ── Input source parameters (INVENTORY / DRY_RUN only — see the
        # matching comment block in resources/01_inventory_job.yml for the
        # full auto-detection rules). DEEP_CLONE/VALIDATE/RETRY below always
        # use input_type=JOB because those modes operate purely on
        # migration_control rows filtered by batch_id — they never re-resolve
        # table selection, so CSV/YAML awareness is irrelevant to them.
        - name: input_type
          default: ${var.input_type}
        - name: yaml_config_path
          default: ${var.yaml_config_path}
        - name: csv_path
          default: ${var.csv_path}
        # exclusion_csv_path: GLOBAL catalog/schema/table exclusion list,
        # applied on top of whichever input_type resolved the selection
        # (JOB/YAML/CSV) — see the matching comment in
        # resources/01_inventory_job.yml and orchestrator/exclusion_manager.py
        # for the CSV format. Excluded tables are skipped at INVENTORY and
        # logged to migration_exclusion_log for audit. Blank = no exclusions.
        - name: exclusion_csv_path
          default: ${var.exclusion_csv_path}
        - name: source_catalogs
          default: ${var.source_catalog_filter}
        - name: source_schemas
          default: ${var.source_schema_filter}
        - name: source_tables
          default: ${var.source_table_filter}
        - name: target_catalog
          default: ${var.target_catalog}
        - name: clone_type
          default: ${var.clone_type}
        - name: meta_catalog
          default: ${var.meta_catalog}
        - name: meta_schema
          default: ${var.meta_schema}
        - name: validation_enabled
          default: ${var.validation_enabled}
        - name: row_count_validation
          default: ${var.row_count_validation}
        - name: max_retries
          default: ${var.max_retries}
        - name: selection_type
          default: catalog
        - name: run_id
          default: ""
        # ── Batch / Chunk parameters ──────────────────────────────────────────
        - name: batch_id
          default: ${var.batch_id}
        - name: max_concurrent_chunks
          default: ${var.max_concurrent_chunks}
        - name: parallel_threads
          default: ${var.parallel_threads}
        - name: chunk_capacity_gb
          default: ${var.chunk_capacity_gb}
        - name: min_executors
          default: ${var.min_executors}
        - name: worker_spark_version
          default: ${var.worker_spark_version}
        - name: worker_notebook_path
          default: ${var.worker_notebook}   # deployed path to chunk_worker_notebook
        # force_reonboard: INVENTORY is idempotent by default and SKIPS tables
        # already COMPLETED/VALIDATED/FAILED_PERMANENT/SKIPPED — see the
        # matching comment in resources/01_inventory_job.yml. Set to "true" to
        # re-onboard the same CSV/YAML table list again under a fresh
        # batch_id/run_id (e.g. to re-exercise a repeat end-to-end test).
        - name: force_reonboard
          default: "${var.force_reonboard}"
        # require_target_precreated: governance gate — see the matching
        # comment in resources/01_inventory_job.yml. Default "false"
        # preserves the original behavior (DEEP_CLONE auto-creates the
        # target table).
        - name: require_target_precreated
          default: "${var.require_target_precreated}"
        # skip_describe_detail: see the matching comment in
        # resources/01_inventory_job.yml and databricks.yml. Default "false"
        # preserves full DESCRIBE DETAIL metadata collection.
        - name: skip_describe_detail
          default: "${var.skip_describe_detail}"
        # target_warehouse_id / source_warehouse_id: plain (non-secret) SQL
        # warehouse identifiers — NOT credentials. No client_id/client_secret/
        # secret-scope anywhere: SqlClient/ApiClient authenticate natively via
        # databricks.sdk.core.Config(). source_warehouse_id is only consulted
        # when clone_type=direct_adls.
        - name: target_warehouse_id
          default: ${var.target_warehouse_id}
        - name: source_warehouse_id
          default: ${var.source_warehouse_id}

      # ── Tasks ──────────────────────────────────────────────────────────────
      tasks:
        # Task 1: INVENTORY — discover and onboard tables
        - task_key: inventory
          description: "Discover source tables and onboard into migration_control (QUEUED)."
          notebook_task:
            notebook_path: ${var.orchestrator_notebook}
            base_parameters:
              mode: INVENTORY
              input_type: "{{job.parameters.input_type}}"
              yaml_config_path: "{{job.parameters.yaml_config_path}}"
              csv_path: "{{job.parameters.csv_path}}"
              exclusion_csv_path: "{{job.parameters.exclusion_csv_path}}"
              selection_type: "{{job.parameters.selection_type}}"
              source_catalogs: "{{job.parameters.source_catalogs}}"
              source_schemas: "{{job.parameters.source_schemas}}"
              source_tables: "{{job.parameters.source_tables}}"
              target_catalog: "{{job.parameters.target_catalog}}"
              clone_type: "{{job.parameters.clone_type}}"
              meta_catalog: "{{job.parameters.meta_catalog}}"
              meta_schema: "{{job.parameters.meta_schema}}"
              run_id: "{{job.parameters.run_id}}"
              batch_id: "{{job.parameters.batch_id}}"
              chunk_capacity_gb: "{{job.parameters.chunk_capacity_gb}}"
              max_concurrent_chunks: "{{job.parameters.max_concurrent_chunks}}"
              parallel_threads: "{{job.parameters.parallel_threads}}"
              min_executors: "{{job.parameters.min_executors}}"
              force_reonboard: "{{job.parameters.force_reonboard}}"
              require_target_precreated: "{{job.parameters.require_target_precreated}}"
              skip_describe_detail: "{{job.parameters.skip_describe_detail}}"
              target_warehouse_id: "{{job.parameters.target_warehouse_id}}"
              source_warehouse_id: "{{job.parameters.source_warehouse_id}}"
          job_cluster_key: orchestrator_cluster

        # Task 2: DRY_RUN — runs in parallel with INVENTORY for pre-flight report
        - task_key: dry_run
          description: "Print execution plan without touching data. Runs parallel to INVENTORY."
          notebook_task:
            notebook_path: ${var.orchestrator_notebook}
            base_parameters:
              mode: DRY_RUN
              input_type: "{{job.parameters.input_type}}"
              yaml_config_path: "{{job.parameters.yaml_config_path}}"
              csv_path: "{{job.parameters.csv_path}}"
              exclusion_csv_path: "{{job.parameters.exclusion_csv_path}}"
              selection_type: "{{job.parameters.selection_type}}"
              source_catalogs: "{{job.parameters.source_catalogs}}"
              source_schemas: "{{job.parameters.source_schemas}}"
              source_tables: "{{job.parameters.source_tables}}"
              target_catalog: "{{job.parameters.target_catalog}}"
              clone_type: "{{job.parameters.clone_type}}"
              meta_catalog: "{{job.parameters.meta_catalog}}"
              meta_schema: "{{job.parameters.meta_schema}}"
              target_warehouse_id: "{{job.parameters.target_warehouse_id}}"
              source_warehouse_id: "{{job.parameters.source_warehouse_id}}"
          job_cluster_key: orchestrator_cluster

        # Task 3: DEEP_CLONE — runs after INVENTORY completes
        - task_key: deep_clone
          description: "Execute DEEP CLONE for all QUEUED tables."
          depends_on:
            - task_key: inventory
          notebook_task:
            notebook_path: ${var.orchestrator_notebook}
            base_parameters:
              mode: DEEP_CLONE
              input_type: JOB
              clone_type: "{{job.parameters.clone_type}}"
              meta_catalog: "{{job.parameters.meta_catalog}}"
              meta_schema: "{{job.parameters.meta_schema}}"
              validation_enabled: "{{job.parameters.validation_enabled}}"
              row_count_validation: "{{job.parameters.row_count_validation}}"
              max_retries: "{{job.parameters.max_retries}}"
              run_id: "{{job.parameters.run_id}}"
              # Read from the inventory task's published task value, NOT the raw
              # job parameter — this is what makes batch_id=blank (auto-generate)
              # work correctly across the whole workflow: inventory generates one
              # random batch_id and publishes it via dbutils.jobs.taskValues.set(),
              # and every downstream task reads that SAME value here instead of
              # each independently generating its own random ID. See the comment
              # in notebooks/orchestrator_notebook.py at the taskValues.set() call.
              batch_id: "{{tasks.inventory.values.batch_id}}"
              max_concurrent_chunks: "{{job.parameters.max_concurrent_chunks}}"
              parallel_threads: "{{job.parameters.parallel_threads}}"
              chunk_capacity_gb: "{{job.parameters.chunk_capacity_gb}}"
              min_executors: "{{job.parameters.min_executors}}"
              worker_notebook_path: "{{job.parameters.worker_notebook_path}}"
              target_warehouse_id: "{{job.parameters.target_warehouse_id}}"
              # No spark_env_vars needed — chunk_worker_notebook.py runs DEEP
              # CLONE directly via Spark on its own cluster and never calls
              # SqlClient/ApiClient, so it has no auth/secrets dependency.
              # Provisioned on-demand (NOT via the shared control-plane
              # instance_pool_id — see resources/03_deep_clone_job.yml).
              worker_cluster_json: >
                {
                  "spark_version": "${var.worker_spark_version}",
                  "node_type_id": "${var.worker_node_type}",
                  "azure_attributes": {"availability": "ON_DEMAND_AZURE"},
                  "num_workers": ${var.worker_num_workers},
                  "data_security_mode": "DATA_SECURITY_MODE_AUTO",
                  "spark_conf": {"spark.databricks.delta.preview.enabled": "true"}
                }
          job_cluster_key: orchestrator_cluster

        # Task 4: RETRY — runs after DEEP_CLONE, handles RETRY_PENDING tables
        - task_key: retry
          description: "Re-queue and re-clone any RETRY_PENDING tables."
          depends_on:
            - task_key: deep_clone
          notebook_task:
            notebook_path: ${var.orchestrator_notebook}
            base_parameters:
              mode: RETRY
              input_type: JOB
              meta_catalog: "{{job.parameters.meta_catalog}}"
              meta_schema: "{{job.parameters.meta_schema}}"
              max_retries: "{{job.parameters.max_retries}}"
              run_id: "{{job.parameters.run_id}}"
              # See the comment on the deep_clone task above — read from the
              # published task value so this matches inventory's/deep_clone's
              # batch_id even when it was auto-generated (job parameter blank).
              batch_id: "{{tasks.inventory.values.batch_id}}"
              max_concurrent_chunks: "{{job.parameters.max_concurrent_chunks}}"
              parallel_threads: "{{job.parameters.parallel_threads}}"
              min_executors: "{{job.parameters.min_executors}}"
              worker_notebook_path: "{{job.parameters.worker_notebook_path}}"
              target_warehouse_id: "{{job.parameters.target_warehouse_id}}"
              # No spark_env_vars needed (see deep_clone task comment above).
              worker_cluster_json: >
                {
                  "spark_version": "${var.worker_spark_version}",
                  "node_type_id": "${var.worker_node_type}",
                  "azure_attributes": {"availability": "ON_DEMAND_AZURE"},
                  "num_workers": ${var.worker_num_workers},
                  "data_security_mode": "DATA_SECURITY_MODE_AUTO"
                }
          job_cluster_key: orchestrator_cluster

        # Task 5: VALIDATE — runs after RETRY completes
        - task_key: validate
          description: "Validate all COMPLETED clones against source metadata."
          depends_on:
            - task_key: retry
          notebook_task:
            notebook_path: ${var.orchestrator_notebook}
            base_parameters:
              mode: VALIDATE
              input_type: JOB
              clone_type: "{{job.parameters.clone_type}}"
              meta_catalog: "{{job.parameters.meta_catalog}}"
              meta_schema: "{{job.parameters.meta_schema}}"
              validation_enabled: "true"
              row_count_validation: "{{job.parameters.row_count_validation}}"
              run_id: "{{job.parameters.run_id}}"
              # See the comment on the deep_clone task above.
              batch_id: "{{tasks.inventory.values.batch_id}}"
              target_warehouse_id: "{{job.parameters.target_warehouse_id}}"
              source_warehouse_id: "{{job.parameters.source_warehouse_id}}"
          job_cluster_key: orchestrator_cluster

      # ── Shared job cluster ─────────────────────────────────────────────────
      job_clusters:
        - job_cluster_key: orchestrator_cluster
          new_cluster:
            spark_version: ${var.worker_spark_version}
            instance_pool_id: ${var.instance_pool_id}
            num_workers: 2
            # REQUIRED for Unity Catalog access — see 00_setup_control_tables.yml
            # for the full rationale (avoids non-UC "No Isolation Shared" default).
            data_security_mode: DATA_SECURITY_MODE_AUTO
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
              spark.sql.adaptive.enabled: "true"
            spark_env_vars:
              PYTHONPATH: "${workspace.file_path}"
            # NOTE: no cluster_log_conf here — dbfs:/ log delivery destinations
            # are rejected outright ("INVALID_PARAMETER_VALUE: Invalid cluster
            # log storage info") in workspaces where legacy DBFS root access is
            # disabled (common alongside Unity Catalog hardening). Logs remain
            # fully viewable live in the job run UI without this; re-add only
            # as a volumes: destination pointing at a pre-provisioned UC Volume
            # if durable log retention is required.

      # ── Notifications ──────────────────────────────────────────────────────
      email_notifications:
        on_failure:
          - vivek.ravichandiran@databricks.com
        on_success:
          - vivek.ravichandiran@databricks.com

      # ── Health check ──────────────────────────────────────────────────────
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 86400   # alert if workflow takes > 24h
